version: '3.9'

services:
  # ── PostgreSQL Database ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: pakverify_db
    environment:
      POSTGRES_DB: pakverify_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Django Backend ───────────────────────────────────────────────
  backend:
    build: ./backend
    container_name: pakverify_backend
    environment:
      DB_TYPE: postgresql
      POSTGRES_DB: pakverify_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_pass
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      AI_SERVICE_URL: http://ai-service:8001
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ./backend/media:/app/media
      - ./backend/staticfiles:/app/staticfiles
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_data &&
             python manage.py runserver 0.0.0.0:8000"

  # ── FastAPI AI Microservice ──────────────────────────────────────
  ai-service:
    build: ./ai_microservice
    container_name: pakverify_ai
    ports:
      - "8001:8001"

  # ── React Frontend ───────────────────────────────────────────────
  frontend:
    build: .
    container_name: pakverify_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
